name: Build and release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 覆盖 action 默认的 "tools platform-tools"：旧 tools 包已从新 SDK 仓库移除，
          # 会在 setup 阶段直接失败。只安装本项目实际需要的平台和构建工具。
          packages: "platform-tools platforms;android-37 build-tools;37.0.0"

      - name: Build arm64 release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # 此仓库当前未配置私钥 Secret。为保证 Release 附件可安装，CI 使用临时
      # debug keystore 签名；正式商店分发可在后续接入自己的签名 Secret。
      - name: Sign release APK
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
            -alias toolbox -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Toolbox, OU=Release, O=Toolbox, C=CN"
          UNSIGNED="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/Toolbox-${GITHUB_REF_NAME}-arm64-v8a.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias toolbox \
            --ks-pass pass:android --key-pass pass:android --out "$SIGNED" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$SIGNED"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-${{ github.ref_name }}-arm64-v8a
          path: app/build/outputs/apk/release/Toolbox-${{ github.ref_name }}-arm64-v8a.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/Toolbox-${{ github.ref_name }}-arm64-v8a.apk
